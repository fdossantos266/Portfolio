    <text x="490" y="385">MQTT</text>
    <rect x="620" y="350" width="170" height="100" rx="12" fill="#141823" stroke="#252b3a" stroke-width="2"/>
    <text x="705" y="395" text-anchor="middle" fill="#e9ecf3">Node.js</text>
    <text x="705" y="425" text-anchor="middle">API · WS</text>
    <path d="M705 450 V560" stroke="#ffd000" stroke-width="3" stroke-dasharray="10 8"/>
    <ellipse cx="705" cy="580" rx="80" ry="20" fill="#141823" stroke="#252b3a" stroke-width="2"/>
    <rect x="625" y="580" width="160" height="80" fill="#141823"/>
    <path d="M625 580 V660 A80 20 0 0 0 785 660 V580" fill="#141823" stroke="#252b3a" stroke-width="2"/>
