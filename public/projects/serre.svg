    <text x="150" y="108" text-anchor="middle" font-family="Consolas,monospace" font-size="22" fill="#3ddc84">ESP32</text>
    <g fill="#ffd000">
      <rect x="20" y="-14" width="10" height="14"/><rect x="50" y="-14" width="10" height="14"/><rect x="80" y="-14" width="10" height="14"/><rect x="110" y="-14" width="10" height="14"/><rect x="140" y="-14" width="10" height="14"/><rect x="170" y="-14" width="10" height="14"/><rect x="200" y="-14" width="10" height="14"/><rect x="230" y="-14" width="10" height="14"/><rect x="260" y="-14" width="10" height="14"/>
      <rect x="20" y="200" width="10" height="14"/><rect x="50" y="200" width="10" height="14"/><rect x="80" y="200" width="10" height="14"/><rect x="110" y="200" width="10" height="14"/><rect x="140" y="200" width="10" height="14"/><rect x="170" y="200" width="10" height="14"/><rect x="200" y="200" width="10" height="14"/><rect x="230" y="200" width="10" height="14"/><rect x="260" y="200" width="10" height="14"/>
    </g>
  </g>
  <!-- leaf -->
  <g transform="translate(250 150)">
    <path d="M40 90 C40 30 90 0 150 0 C150 60 110 100 40 90 Z" fill="#3ddc84" opacity=".9"/>
    <path d="M40 90 L120 25" stroke="#0c1a14" stroke-width="5"/>
  </g>
