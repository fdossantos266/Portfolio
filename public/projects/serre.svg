    <rect x="30" y="200" width="520" height="290" rx="12" fill="#0b0d12"/>
    <path d="M50 430 L110 400 L170 410 L230 350 L290 370 L350 300 L410 320 L470 260 L530 280 L530 470 L50 470 Z" fill="url(#area)"/>
